(()=>{

const uid=()=>Math.random().toString(36).slice(2,9),getO=id=>S.objs.find(o=>o.id===id),OC=['#ffffff','#2b2118','#c8342b','#f2c230','#2f6fb3','#3f8f4a'];

async function api(p,o={}){const r=await fetch(p,{method:o.method||'GET',headers:o.body?{'content-type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined,credentials:'same-origin'});
 if(!r.ok){const e=new Error(r.status);e.status=r.status;throw e}return r.json()}
function applyRemote(bid,rows){let ch=false;
 for(const r of rows){const arr=r.k==='t'?S.tasks:S.objs,i=arr.findIndex(x=>x.id===r.id),cur=arr[i];if(cur&&(cur.u||0)>=r.u)continue;
  if(r.gone){if(i>=0){arr.splice(i,1);SIG.delete(r.id);ch=true}continue}
  let d;try{d=JSON.parse(r.d)}catch(e){continue}d.u=r.u;d.b=bid;if(i>=0)arr[i]=d;else arr.push(d);SIG.set(r.id,{j:sg(d),k:r.k,b:bid});ch=true;if(d.z>zTop)zTop=d.z}
 if(ch){if(S.sel&&!get(S.sel))S.sel=null;if(S.osel&&!getO(S.osel))S.osel=null;render();persist()}}
async function syncAll(){if(!C.user||C.busy||g)return;C.busy=true;const a=$('#acct');
 try{
  for(const id of C.delb.splice(0)){try{await api('/api/boards/'+id,{method:'DELETE'})}catch(e){}}
  for(const b of S.boards){const k=b.name+'|'+(b.team||'');if(!b.cloud||b.pn!==k){try{await api('/api/boards/'+b.id,{method:'PUT',body:{name:b.name,team_id:b.team||null}});b.cloud=1}catch(e){toast('ボードの共有設定を変更できませんでした')}b.pn=k}}
  const sent=new Set();
  for(const b of S.boards.slice()){const cu=C.cur[b.id]||(C.cur[b.id]={c:0,p:0}),mx=Date.now();
   const its=[...itemsOf().filter(([k,x])=>x.b===b.id&&x.u>cu.p).map(([k,x])=>({id:x.id,k,d:JSON.stringify(x),u:x.u})),...C.tomb.filter(t=>t.b===b.id).map(t=>({id:t.id,k:t.k,u:t.u,gone:1}))];
   for(let i=0;i===0||i<its.length;i+=400){let r;try{r=await api('/api/boards/'+b.id+'/sync',{method:'POST',body:{since:cu.c,items:its.slice(i,i+400)}})}catch(e){if(e.status===403){await pullBoards();return}throw e}
    cu.c=r.seq;applyRemote(b.id,r.items)}
   its.forEach(i=>{if(i.gone)sent.add(i.id)});cu.p=mx}
  C.tomb=C.tomb.filter(t=>!sent.has(t.id));persist();a.classList.remove('off')
 }catch(e){a.classList.add('off')}finally{C.busy=false}}
async function pullBoards(){
 for(const b of S.boards){const k=b.name+'|'+(b.team||'');if(!b.cloud||b.pn!==k){try{await api('/api/boards/'+b.id,{method:'PUT',body:{name:b.name,team_id:b.team||null}});b.cloud=1}catch(e){}b.pn=k}}
 const L=await api('/api/boards'),ids=new Set(L.map(r=>r.id));
 for(const r of L){let b=S.boards.find(x=>x.id===r.id);if(!b)S.boards.push(b={id:r.id,cloud:1});
  if(b.pn===undefined||b.pn===b.name+'|'+(b.team||'')){b.name=r.name;b.team=r.team_id;b.pn=b.name+'|'+(b.team||'')}}
 S.boards=S.boards.filter(b=>ids.has(b.id));S.tasks=S.tasks.filter(t=>ids.has(t.b));S.objs=S.objs.filter(o=>ids.has(o.b));
 if(!S.boards.length){S.boards.push({id:uid(),name:'ボード1'});return pullBoards()}
 if(!S.boards.some(b=>b.id===S.bd))S.bd=S.boards[0].id;seedSig();render();persist()}
