name = "corkboard"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "corkboard"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
GOOGLE_CLIENT_ID = "REPLACE.apps.googleusercontent.com"
