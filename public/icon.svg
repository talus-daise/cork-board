<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="cork" cx="35%" cy="30%" r="90%">
      <stop offset="0" stop-color="#d8b184"/>
      <stop offset="1" stop-color="#b98a56"/>
    </radialGradient>
    <pattern id="dots" width="37" height="41" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="10" r="2" fill="#8f6a3d" opacity="0.5"/>
      <circle cx="26" cy="30" r="1.6" fill="#e0bd8a" opacity="0.7"/>
